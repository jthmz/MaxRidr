<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#02060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Deck">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>__BRAND__ Deck</title>
<!--
  What a screen sees before it has been paired with the Deck. It sends the 6-digit code the Deck is showing; the Mac answers with
  a key in a cookie and from then on this address shows the Deck itself. A code scanned from the Deck's QR arrives after the "#".
  Plain old JavaScript on purpose, so an old tablet can run it.
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;background:#02060a}
body{min-height:100%;display:flex;padding:24px 20px;color:#eaf9ff;font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:18px;line-height:26px;-webkit-text-size-adjust:100%;
  background-color:#02060a;background-image:radial-gradient(ellipse at 50% -10%,rgba(34,211,245,.18),rgba(2,6,10,0) 60%),radial-gradient(rgba(34,211,245,.14) 1px,rgba(2,6,10,0) 1.5px);background-size:auto,22px 22px}
main{position:relative;margin:auto;width:100%;max-width:440px;padding:26px 24px 20px;background:rgba(6,16,24,.86);border:1px solid rgba(34,211,245,.3);text-align:center}
main:before,main:after{content:"";position:absolute;width:16px;height:16px}
main:before{left:-1px;top:-1px;border-left:2px solid #22d3f5;border-top:2px solid #22d3f5}
main:after{right:-1px;bottom:-1px;border-right:2px solid #ffe81a;border-bottom:2px solid #ffe81a}
.bolt{width:40px;height:62px;filter:drop-shadow(0 0 10px rgba(34,211,245,.6))}
h1{margin-top:8px;font-size:15px;line-height:20px;letter-spacing:4px;font-weight:700;color:#22d3f5;text-transform:uppercase}
h2{margin-top:6px;font-size:30px;line-height:36px;font-weight:800;color:#ffe81a;text-shadow:0 0 14px rgba(255,232,26,.45)}
p{margin-top:12px;color:#b9d3dc}
p b{color:#eaf9ff}
form{margin-top:18px}
label{position:absolute;left:-9999px}
input{display:block;width:100%;height:68px;padding:0 0 0 10px;background:rgba(2,7,11,.9);border:1px solid #22d3f5;border-radius:0;color:#ffe81a;font-family:inherit;font-size:38px;font-weight:800;letter-spacing:10px;text-align:center;outline:none;-webkit-appearance:none;appearance:none}
input:focus{box-shadow:0 0 16px rgba(34,211,245,.45)}
input::placeholder{color:rgba(143,176,188,.35)}
button{display:block;width:100%;height:58px;margin-top:12px;background:#ffe81a;border:0;border-radius:0;color:#02060a;font-family:inherit;font-size:20px;font-weight:700;letter-spacing:1px;box-shadow:0 0 16px rgba(255,232,26,.4)}
button:disabled{opacity:.5}
#m{min-height:52px;color:#eaf9ff}
#m.bad{color:#ff9aab}
@media (max-height:460px){
  body{padding:12px 20px}
  main{padding:14px 24px 10px}
  .bolt{display:none}
  h1{margin-top:0}
  h2{font-size:24px;line-height:30px}
  p{margin-top:8px}
  form{margin-top:10px}
  input{height:56px;font-size:32px}
  button{height:50px;margin-top:10px}
  #m{min-height:26px}
}
</style></head>
<body>
<main>
  <svg class="bolt" viewBox="0 0 40 62" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8fdff"/><stop offset=".45" stop-color="#4fe0f2"/><stop offset="1" stop-color="#0f9fbd"/></linearGradient></defs><polygon points="25,2 5,35 18,35 11,60 36,24 22,24 31,2" fill="url(#g)" stroke="#bff8ff" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <h1>__BRAND__ Deck</h1>
  <h2>Pair this screen</h2>
  <p>On the Deck, tap the clock at the top right, then <b>Add a screen</b>. Type the 6-digit code it shows.</p>
  <form id="f" autocomplete="off" novalidate>
    <label for="c">6-digit code</label>
    <input id="c" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" placeholder="000000" autofocus>
    <button id="b" type="submit">Pair</button>
  </form>
  <p id="m" role="status" aria-live="polite"></p>
</main>
<script>
(function () {
  var f = document.getElementById('f'), c = document.getElementById('c'), b = document.getElementById('b'), m = document.getElementById('m'), busy = false;
  function say(t, bad) { m.textContent = t; m.className = bad ? 'bad' : ''; }
  function free() { busy = false; b.disabled = false; }
  function go(code) {
    if (busy) return;
    busy = true; b.disabled = true; say('Checking…');
    fetch('/api/pair', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code, touch: navigator.maxTouchPoints > 1 }) })
      .then(function (r) { return r.json(); })
      .then(function (o) {
        if (o.ok) {
          say('Paired. Opening the Deck…');
          try { history.replaceState(null, '', '/'); } catch (e) { /* an old browser keeps the code in the address, which is spent anyway */ }
          return location.reload();
        }
        free(); c.value = '';
        say(o.why === 'closed' ? 'No code is showing right now. On the Deck, tap the clock, then Add a screen, and use the new code.' : 'That code did not match. Check the Deck and try again.', true);
      })
      .catch(function () { free(); say('Could not reach the Deck. Check that this screen is on the same network as the Mac.', true); });
  }
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = c.value.replace(/\D/g, '');
    if (v.length === 6) go(v); else say('The code has 6 digits.', true);
  });
  c.addEventListener('input', function () {
    var v = c.value.replace(/\D/g, '').slice(0, 6);
    if (v !== c.value) c.value = v;
    if (v.length === 6) go(v);
  });
  var h = (location.hash.match(/\d{6}/) || [])[0];
  if (h) { c.value = h; go(h); }
})();
</script>
</body></html>
