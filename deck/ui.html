<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=800,height=480,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MAXAPACITY Deck</title>
<!--
  Runs on the Car Thing's Chromium 69: no optional chaining, no flex gap, comma-style colors only.
  Design ("arc"): one type family (the device's own Circular, with fallbacks elsewhere), four signal colours, ring gauges,
  brackets and a 3D bolt. The screen is 4 inches and sits at arm's length, so titles are 23px or larger and running text 20px or larger (ISO 15008's 12 arcminute minimum at 50 cm is about 23px here).
  Whatever moves all the time is a whole element animated with transform or opacity only, so the compositor does the work.
  Standby pictures and clips are drawn on small canvases and every decoded frame is closed at once: see the notes there.
-->
<style>
:root{--bg:#02060a;--panel:rgba(6,16,24,.84);--line:rgba(34,211,245,.26);--edge:rgba(34,211,245,.6);--fg:#eaf9ff;--dim:#8fb0bc;--y:#ffe81a;--c:#22d3f5;--g:#39ff88;--r:#ff4d6a;
  --f:"Circular Sp UI v3 T","Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;--w9:900}
body.pv{--w9:700}
/* in a normal browser (the preview, or a paired phone, tablet or computer) the 800x480 stage is scaled to fit the window by fit() */
html.pv{width:100%;height:100%;background:#02060a;overscroll-behavior:none}
html.pv body{position:absolute;left:0;top:0;transform-origin:0 0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:800px;height:480px;overflow:hidden;color:var(--fg);font-family:var(--f);font-size:20px;line-height:26px}
body{background-color:#02060a;background-image:radial-gradient(ellipse at 50% -20%,rgba(34,211,245,.17),rgba(2,6,10,0) 62%),radial-gradient(rgba(34,211,245,.14) 1px,rgba(2,6,10,0) 1.5px);background-size:auto,22px 22px}
body:before{content:"";position:absolute;left:-300px;bottom:-30px;width:1400px;height:330px;opacity:.5;
  background-image:linear-gradient(to bottom,#02060a 0%,rgba(2,6,10,0) 70%),repeating-linear-gradient(90deg,rgba(34,211,245,.55) 0,rgba(34,211,245,.55) 2px,transparent 2px,transparent 70px),repeating-linear-gradient(0deg,rgba(34,211,245,.55) 0,rgba(34,211,245,.55) 2px,transparent 2px,transparent 44px);
  transform:perspective(320px) rotateX(64deg);transform-origin:50% 100%}
body:after{content:"";position:absolute;left:0;top:0;width:800px;height:480px;z-index:60;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0,rgba(0,0,0,.14) 1px,transparent 1px,transparent 3px)}
::-webkit-scrollbar{display:none}
/* ---------- shared pieces ---------- */
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.two{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dim{color:var(--dim)}
.lab{font-size:16px;line-height:20px;font-weight:700;letter-spacing:2px;color:var(--c);text-transform:uppercase}
.h{display:grid;grid-template-columns:1fr auto;grid-gap:12px;align-items:center}
.h>div{min-width:0}
.tap:active{opacity:.55}
.card{position:relative;background:var(--panel);border:1px solid var(--line);box-shadow:inset 0 0 24px rgba(34,211,245,.06)}
.card:before{content:"";position:absolute;left:-1px;top:-1px;width:14px;height:14px;border-left:2px solid var(--c);border-top:2px solid var(--c)}
.card:after{content:"";position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-right:2px solid var(--y);border-bottom:2px solid var(--y)}
.bar{position:relative;height:16px;background:rgba(34,211,245,.13);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--y)}
.bar i.g{background:var(--g)} .bar i.r{background:var(--r)} .bar i.c{background:var(--c)}
.bar:after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 9px,#02060a 9px,#02060a 11px)}
.bar.ind i{width:28%;animation:slide 1.5s linear infinite}
.cells{display:grid;grid-gap:4px;height:16px;margin-top:8px}
.cells i{display:block;background:rgba(34,211,245,.15)}
.cells i.d{background:var(--c)} .cells.w i.d{background:var(--g)}
.cells i.go{background:var(--y);box-shadow:0 0 8px rgba(255,232,26,.8);animation:pulse 1.1s ease-in-out infinite}
.chip{display:inline-block;padding:2px 10px;font-size:16px;line-height:22px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;vertical-align:middle;white-space:nowrap;background:rgba(34,211,245,.08);border:1px solid var(--line);color:var(--fg)}
.chip.y{background:rgba(255,232,26,.12);color:var(--y);border-color:var(--y)} .chip.g{background:rgba(57,255,136,.12);color:var(--g);border-color:var(--g)}
.chip.r{background:rgba(255,77,106,.12);color:var(--r);border-color:var(--r)} .chip.c{background:rgba(34,211,245,.12);color:var(--c);border-color:var(--c)}
.n2{font-size:24px;line-height:28px;font-weight:var(--w9);margin-left:8px;vertical-align:middle}
.hot{color:var(--g);font-weight:700;text-shadow:0 0 8px rgba(57,255,136,.6)}
.btn{display:inline-block;min-width:160px;height:60px;line-height:58px;padding:0 22px;margin-right:12px;text-align:center;font-weight:700;font-size:20px;letter-spacing:1px;background:rgba(34,211,245,.08);border:1px solid var(--c);color:var(--c)}
.btn.y{background:var(--y);border-color:var(--y);color:#02060a;box-shadow:0 0 16px rgba(255,232,26,.4)}
.btn.sm{min-width:0;padding:0 18px;margin-right:10px}
.btn.xs{min-width:112px;height:52px;line-height:50px;margin-right:10px}
.btn.on{background:var(--g);border-color:var(--g);color:#02060a}
.pm{width:64px;min-width:64px;padding:0;margin:0;font-size:34px}
/* ring gauge: a track, an arc for the value, the number in the middle */
.rg{position:relative}
.rg svg{position:absolute;left:0;top:0;width:100%;height:100%}
.rg circle{fill:none}
.rg .trk{stroke:rgba(34,211,245,.15)}
.rg .tks{stroke:rgba(34,211,245,.5)}
.rg .arc{stroke:var(--y)} .rg .arc.g{stroke:var(--g)} .rg .arc.r{stroke:var(--r)} .rg .arc.c{stroke:var(--c)}
.rg .ri{position:absolute;left:0;top:0;width:100%;height:100%;text-align:center;font-weight:var(--w9)}
.rg .ri small{font-size:55%;font-weight:700;color:var(--dim)}
.spin1,.spin2{position:absolute;border-radius:50%}
.spin1{border:2px dashed rgba(34,211,245,.4);animation:rot 70s linear infinite}
.spin2{border:2px solid transparent;border-top-color:rgba(34,211,245,.85);border-right-color:rgba(34,211,245,.22);animation:rot 12s linear infinite reverse}
/* the bolt: nine stacked layers make a solid 3D shape that turns all the time; .go is a fast one-shot turn */
.boltw{position:relative;display:inline-block;vertical-align:middle;width:30px;height:46px;-webkit-perspective:260px;perspective:260px}
.boltw:before{content:"";position:absolute;left:-60%;top:-25%;width:220%;height:150%;border-radius:50%;background:radial-gradient(closest-side,rgba(34,211,245,.5),rgba(34,211,245,0))}
.bolt{position:absolute;left:0;top:0;width:100%;height:100%;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;animation:spin 5s linear infinite}
.bolt.go{animation:spin .7s ease-out 1}
.bolt svg{position:absolute;left:0;top:0;display:block;width:100%;height:100%;overflow:visible}
.boltw.lg{width:104px;height:160px} .boltw.am{width:84px;height:130px}
.emb{position:relative;margin:0 auto}
@keyframes spin{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}
@keyframes rot{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(380%)}}
@keyframes sweep{0%{transform:translateY(0)}100%{transform:translateY(430px)}}
/* ---------- top bar ---------- */
#top{position:absolute;left:0;top:0;width:800px;height:54px;z-index:2;background:rgba(2,7,11,.94);border-bottom:1px solid var(--edge);box-shadow:0 0 18px rgba(34,211,245,.3)}
#top:after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:5px;background:repeating-linear-gradient(90deg,rgba(34,211,245,.45) 0,rgba(34,211,245,.45) 1px,transparent 1px,transparent 10px)}
#tb{float:left;width:58px;height:54px;padding:4px 0 0 16px}
#tb .boltw:before{left:-45%;top:-10%;width:190%;height:120%;opacity:.7}
.tab{position:relative;float:left;height:54px;line-height:54px;padding:0 17px;white-space:nowrap;text-align:center;font-weight:700;font-size:20px;letter-spacing:1.5px;color:var(--dim)}
.tab.on{color:var(--y);text-shadow:0 0 12px rgba(255,232,26,.8)}
.tab.on:after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;background:var(--y);box-shadow:0 0 10px var(--y)}
.tab b{display:inline-block;min-width:24px;margin-left:6px;padding:0 6px;height:26px;line-height:24px;border:1px solid var(--c);color:var(--c);font-size:16px;letter-spacing:0;vertical-align:middle}
.tab b:empty{display:none}
.tab b.live{background:var(--g);border-color:var(--g);color:#02060a}
#right{float:right;height:54px;line-height:54px;padding-right:16px;font-weight:700;font-size:24px}
#dot{display:inline-block;width:10px;height:10px;background:var(--g);box-shadow:0 0 8px var(--g);margin-right:10px}
#dot.off{background:var(--r);box-shadow:0 0 8px var(--r)}
.view{position:absolute;left:0;top:54px;width:800px;height:426px;overflow-y:auto;padding:16px 14px;display:none}
.view.on{display:block}
#scan{position:absolute;left:0;top:54px;width:800px;height:426px;z-index:4;overflow:hidden;pointer-events:none;display:none}
#scan i{display:block;height:3px;background:linear-gradient(90deg,rgba(34,211,245,0),var(--c),rgba(34,211,245,0));box-shadow:0 0 18px var(--c);animation:sweep .45s ease-out 1}
/* ---------- home ---------- */
#hG{position:absolute;left:42px;top:14px;width:244px;height:244px}
#hG .spin1{left:0;top:0;width:244px;height:244px}
#hG .spin2{left:9px;top:9px;width:226px;height:226px}
#hG .in{position:absolute;left:38px;top:38px;width:168px;height:168px;text-align:center}
#hBolt{position:absolute;left:69px;top:2px}
#subs{position:absolute;left:0;top:50px;width:168px;font-size:56px;line-height:60px;font-weight:var(--w9);color:var(--y);letter-spacing:-1.5px;text-shadow:0 0 22px rgba(255,232,26,.55)}
#hGoal{position:absolute;left:0;top:113px;width:168px;font-size:20px;line-height:24px;color:var(--dim)} #hGoal b{color:var(--fg)}
#hStats{position:absolute;left:14px;top:266px;width:300px;height:146px}
.stat{display:grid;grid-template-columns:78px 1fr;grid-gap:14px;align-items:center;height:44px;margin-bottom:7px}
.stat .n{font-size:38px;line-height:44px;font-weight:var(--w9);text-align:right;text-shadow:0 0 14px currentColor}
.stat .l{font-size:23px;line-height:28px;font-weight:700}
#hNow{position:absolute;left:326px;top:14px;width:460px;height:150px;padding:12px 16px}
#hNow .t{font-size:26px;line-height:32px;font-weight:700;margin-top:8px}
#hNow .m{font-size:21px;line-height:26px;margin-top:8px}
#hUps{position:absolute;left:326px;top:176px;width:460px;height:234px;padding:12px 16px 0;overflow:hidden}
.up{padding:6px 0 5px;border-top:1px solid var(--line)}
.up:first-of-type{border-top:0}
.up .t{font-size:23px;line-height:28px;font-weight:700}
.up .m{font-size:20px;line-height:24px}
/* ---------- lists ---------- */
.vrow{display:grid;grid-template-columns:72px 1fr auto;grid-gap:16px;align-items:center;height:98px;padding:0 16px;margin-bottom:10px}
.vrow>div{min-width:0}
.vrow .t{font-size:25px;line-height:30px;font-weight:700}
.vrow .s{font-size:21px;line-height:26px;margin-top:4px}
.sec{margin:0 2px 8px} .sec2{margin:18px 2px 8px}
.row{padding:12px 16px 14px;margin-bottom:10px}
.row .t{font-size:24px;line-height:30px;font-weight:700}
.row .s{font-size:21px;line-height:26px;margin-top:8px}
.act{padding:10px 16px;margin-bottom:8px;font-size:21px;line-height:28px}
/* ---------- launch ---------- */
#launch .tiles{display:grid;grid-template-columns:repeat(5,1fr);grid-gap:10px}
.tile{height:148px;padding:15px 4px 0;text-align:center}
.tile .ic{position:relative;width:86px;height:86px;margin:0 auto 9px;border-radius:50%;border:1px solid rgba(34,211,245,.42);box-shadow:inset 0 0 16px rgba(34,211,245,.2),0 0 12px rgba(34,211,245,.12);color:var(--y)}
.tile .ic:before{content:"";position:absolute;left:-6px;top:-6px;right:-6px;bottom:-6px;border-radius:50%;border:2px solid transparent;border-top-color:var(--y);border-right-color:rgba(255,232,26,.28);transform:rotate(-22deg)}
.tile .ic svg{position:absolute;left:18px;top:18px;width:50px;height:50px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(255,232,26,.55))}
.tile .n{font-size:24px;line-height:28px;font-weight:700}
.tile.muted .ic{color:var(--r);border-color:var(--r)} .tile.muted .ic:before{border-top-color:var(--r);border-right-color:rgba(255,77,106,.28)}
.tile.muted .ic svg{filter:none}
#volrow{margin-top:10px;height:88px;padding:0 14px;display:grid;grid-template-columns:auto 1fr auto;grid-gap:18px;align-items:center}
#volrow .bar{height:18px}
/* ---------- sheets ---------- */
#sheet{position:absolute;left:0;top:0;width:800px;height:480px;background:#02060a radial-gradient(rgba(34,211,245,.1) 1px,rgba(2,6,10,0) 1.5px);background-size:22px 22px;padding:14px 26px;display:none;z-index:5}
#sheet h2{font-size:28px;line-height:36px;font-weight:var(--w9);color:var(--y);text-shadow:0 0 14px rgba(255,232,26,.45);padding-bottom:8px;border-bottom:1px solid var(--edge)}
#sheet .body{height:328px;overflow-y:auto;font-size:23px;line-height:32px;padding-top:10px}
#sheet .foot{position:absolute;left:26px;bottom:14px;white-space:nowrap}
.set{display:grid;grid-template-columns:210px 1fr;grid-gap:14px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.gs{display:grid;grid-gap:10px;padding-top:12px;text-align:center}
.gs .rg{margin:0 auto 6px}
.gs .gl{font-size:20px;line-height:24px}
.task{position:relative;padding:5px 0 5px 36px;font-size:23px;line-height:30px}
.task:before{content:"";position:absolute;left:6px;top:13px;width:12px;height:12px;border:2px solid var(--dim)}
.task.done{color:var(--dim)} .task.done:before{background:var(--g);border-color:var(--g)}
.task.go{color:var(--y);font-weight:700} .task.go:before{background:var(--y);border-color:var(--y)}
.vr{display:grid;grid-template-columns:1fr 112px 98px;grid-gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:22px;line-height:30px}
.vr:first-child{border-top:0} .vr span{text-align:right}
.od{display:grid;grid-template-columns:104px 1fr;grid-gap:20px;align-items:center}
.od p{margin-top:8px}
/* pairing another screen: a QR code (dark on white, or phones cannot read it), the address and the code */
.pr{display:grid;grid-template-columns:222px 1fr;grid-gap:26px;align-items:center}
.pr>div{min-width:0}
.qr{width:222px;height:222px;background:#fff}
.qr svg{display:block}
.pu{font-size:26px;line-height:34px;font-weight:700;color:var(--c);word-break:break-all}
.pa{font-size:20px;line-height:24px}
.pc{font-size:56px;line-height:62px;font-weight:var(--w9);color:var(--y);letter-spacing:3px;text-shadow:0 0 18px rgba(255,232,26,.5)}
.sc{display:grid;grid-template-columns:1fr auto;grid-gap:12px;align-items:center;padding:4px 0;border-top:1px solid var(--line)}
.sc>div{min-width:0} .sc .btn{margin-right:0}
/* ---------- overlays ---------- */
#pill{position:absolute;left:170px;bottom:22px;width:460px;padding:12px 22px 18px;background:rgba(2,7,11,.96);border:1px solid var(--c);box-shadow:0 0 18px rgba(34,211,245,.35);display:none;z-index:38}
#pill .lab{font-size:18px;line-height:24px}
#pill .bar{height:18px}
#toast{position:absolute;left:30px;right:30px;bottom:22px;text-align:center;display:none;z-index:40}
#toast span{display:inline-block;max-width:740px;padding:12px 26px;background:var(--y);color:#02060a;font-weight:700;font-size:23px;line-height:30px;box-shadow:0 0 22px rgba(255,232,26,.5)}
#wait{position:absolute;left:0;top:0;width:800px;height:480px;background:var(--bg);z-index:50;text-align:center;padding-top:34px}
#wait .emb,#party .emb{width:220px;height:220px}
#wait .spin1,#party .spin1{left:0;top:0;width:220px;height:220px} #wait .spin2,#party .spin2{left:10px;top:10px;width:200px;height:200px}
#wait .boltw,#party .boltw{position:absolute;left:58px;top:30px}
#wait h1{margin-top:24px;font-size:54px;line-height:60px;font-weight:var(--w9);letter-spacing:8px;color:var(--y);text-shadow:0 0 26px rgba(255,232,26,.6)}
#wait p{margin-top:10px;color:var(--dim);font-size:23px}
#party{position:absolute;left:0;top:0;width:800px;height:480px;background:#02060a radial-gradient(ellipse at 50% 30%,rgba(34,211,245,.2),rgba(2,6,10,0) 60%);z-index:30;display:none;text-align:center;padding-top:20px}
#party .big{font-size:112px;line-height:116px;font-weight:var(--w9);color:var(--y);letter-spacing:-3px;text-shadow:0 0 30px rgba(255,232,26,.7);margin-top:12px}
#party .sm{font-size:24px;color:var(--fg);letter-spacing:4px;text-transform:uppercase;font-weight:700}
/* ---------- standby: pictures and clips behind the clock, a bar for everything in progress ---------- */
#rain{position:absolute;left:0;top:0;z-index:16;display:none}
.scr{position:absolute;left:0;top:0;width:800px;height:480px;z-index:17;display:none;opacity:0;overflow:hidden;background:#02060a;transition:opacity 1.4s linear}
.scr .in{position:absolute;left:0;top:0;width:800px;height:480px}
.scr canvas{position:absolute;width:200px;height:240px}
#amb{position:absolute;left:0;top:0;width:800px;height:480px;z-index:20;display:none;background:rgba(2,6,10,.66)}
#amb.pic{background:rgba(2,6,10,.44)} #amb.clip{background:rgba(2,6,10,.22)}
#amb:before{content:"";position:absolute;left:0;top:0;width:800px;height:230px;background:linear-gradient(to bottom,rgba(2,6,10,.72),rgba(2,6,10,0))}
#amb .ck{position:absolute;left:34px;top:8px;font-size:116px;line-height:116px;font-weight:var(--w9);letter-spacing:-4px;text-shadow:0 0 26px rgba(34,211,245,.55),0 2px 10px #000}
#amb .dt{position:absolute;left:38px;top:126px;font-size:23px;line-height:28px;opacity:.85;text-shadow:0 1px 6px #000}
#amb .md{position:absolute;left:38px;top:160px;font-size:23px;line-height:28px;text-shadow:0 1px 6px #000;white-space:nowrap} #amb .md b{font-size:27px;font-weight:var(--w9)}
#amb .rt{position:absolute;right:34px;top:22px;text-align:right}
#amb .rt .lab{text-shadow:0 1px 6px #000}
#amb .sb{font-size:70px;line-height:74px;font-weight:var(--w9);color:var(--y);letter-spacing:-2px;text-shadow:0 0 22px rgba(255,232,26,.55),0 2px 10px #000}
#amb .rt .dt{position:static;font-size:23px}
#aBolt{position:absolute;left:374px;top:6px;width:150px;height:150px}
#aBolt .spin1{left:0;top:0;width:150px;height:150px} #aBolt .spin2{left:8px;top:8px;width:134px;height:134px}
#aBolt .boltw{position:absolute;left:33px;top:10px}
#aCap{position:absolute;right:34px;top:150px;width:230px;text-align:right;text-shadow:0 1px 6px #000}
#aCap .c1{font-size:18px;line-height:22px;font-weight:700;color:var(--c);letter-spacing:1px}
#aCap .c2{font-size:17px;line-height:20px;opacity:.78}
#aTasks{position:absolute;left:16px;right:16px;bottom:12px;padding:8px 14px 12px;background:rgba(3,9,14,.76);border:1px solid rgba(34,211,245,.32);box-shadow:0 0 18px rgba(0,0,0,.5)}
#aTasks:before{content:"";position:absolute;left:-1px;top:-1px;width:14px;height:14px;border-left:2px solid var(--c);border-top:2px solid var(--c)}
#aTasks:after{content:"";position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-right:2px solid var(--y);border-bottom:2px solid var(--y)}
.tr{margin-top:8px}
.tr .t{font-size:24px;line-height:28px;font-weight:700}
.tr .t span{font-weight:400}
.tr .bar,.tr .cells{margin-top:4px;height:14px}
.mt{position:relative;height:29px;padding-left:32px;font-size:22px;line-height:29px}
.tr .bar + .mt,.tr .cells + .mt{margin-top:4px}
.mt:before{content:"";position:absolute;left:6px;top:8px;width:9px;height:9px;border:2px solid var(--dim)}

  }

  }, pic: onPic, clip: onClip, frames: onFrames, clipEnd: onClipEnd, nomedia: noMedia,
    test: { amb: function () { amb(true); }, wake: function () { amb(false); }, tab: tab, party: function () { party('24K', 'subscribers'); }, toast: function (t) { toast(t || 'Claude finished: Check it on the device', 5000); },

  setInterval(function () {

    if (S && S.ambientAfter > 0 && !ambOn && !led && Date.now() - lastInput > S.ambientAfter * 1000) amb(true);
  }, 2000);

  function woke(e) {                        // any input wakes the standby screen; the waking tap does nothing else
    lastInput = Date.now();
    if ($('party').style.display === 'block') { $('party').style.display = 'none'; if (e) { e.stopPropagation(); e.preventDefault(); } return true; }

  }
  document.addEventListener('click', function (e) {
    if (woke(e)) return;

    while (el && el !== document.body && !(el.dataset && Object.keys(el.dataset).length)) el = el.parentNode;
    if (!el || !el.dataset || !S) return;
    d = el.dataset;

    if (d.tab != null) return tab(+d.tab);

    if (d.sheet === 'channel') return showSheet('channel');
    if (d.sheet === 'screens') { if (S.remote && S.remote.on && !S.remote.code) { pairAsk = Date.now(); send({ t: 'pair' }); } return openSheet(screensSheet); }

    if (d.cut) { send({ t: 'cut', id: d.cut }); return toast('Playing the latest cut on your Mac'); }
    if (d.folder) { send({ t: 'folder', id: d.folder }); return toast('Opening the folder on your Mac'); }
    if (d.openowed) { send({ t: 'owed', id: d.openowed }); return toast('Opening on YouTube'); }
    if (d.mute) { send({ t: 'mute' }); S.vol.muted = !S.vol.muted; return drawLaunch(); }
    if (d.vol) return knob(+d.vol);
    if (d.standby) return amb(true);
    if (d.night != null) { S.settings.night = d.night === '1'; send({ t: 'night', on: S.settings.night }); return drawSheet(); }
    if (d.sound != null) { S.settings.sound = d.sound === '1'; send({ t: 'sound', on: S.settings.sound }); return drawSheet(); }
    if (d.reload) { send({ t: 'reload' }); return toast('Reloading'); }
    if (d.inflight != null) {
      if (d.ok !== '1') return toast('File not found. Is the drive plugged in?');
      send({ t: 'inflight', i: +d.inflight }); return toast('Opening on your Mac');
    }
  }, true);
  document.addEventListener('keydown', function (e) {
    var k = e.key;

    if (k >= '1' && k <= '4') tab(+k - 1);
    else if (k === 'Escape' || k === 'Backspace') { if (sheetFn) closeSheet(); else tab(0); }
    else if (k === 'Enter') { if (S) { send({ t: 'mute' }); S.vol.muted = !S.vol.muted; showVol(); drawLaunch(); } }
    else if (k === 'm' || k === 'M') { if (S) { if (sheetFn === settingsSheet) closeSheet(); else showSheet('settings'); } }
    else if (INJ || !S) return;                               // the rest are for a real keyboard
    else if (k === 'ArrowRight' || k === 'ArrowLeft') tab((cur + (k === 'ArrowRight' ? 1 : VIEWS.length - 1)) % VIEWS.length);
    else if (k === 'ArrowDown' || k === 'ArrowUp') { scroller().scrollTop += k === 'ArrowDown' ? 90 : -90; e.preventDefault(); }
    else if (k === 's' || k === 'S') amb(true);
  });
  if (INJ) document.addEventListener('wheel', function (e) { woke(); knob((e.deltaX || e.deltaY) > 0 ? 1 : -1); e.preventDefault(); }, { passive: false });
  else (function poll() {
