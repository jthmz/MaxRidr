name: Ride launcher APK

# Builds the phone app on every push that touches it, attaches the APK to a
# draft release, and (from main, or when run by hand) publishes it as the
# over-the-air update that installed phones pick up on their own.
#
# HOW UPDATES REACH PHONES
#   1. Every build is signed with one long-lived key. Android only installs
#      an update over an app signed with the same key.
#   2. A publishing run puts the APK on the release tagged `ride-ota` and
#      writes a small JSON manifest (version, SHA-256) as that release's notes.
#   3. The app reads the manifest, downloads a newer APK, checks its SHA-256
#      and installs it (see Updater.java). The repository is private, so each
#      phone holds a read-only token for it, pasted once in the app's Settings.
#
# THE SIGNING KEY
#   Kept as an asset on a draft release named "Ride launcher signing key (do
#   not delete)", created the first time this runs. Draft releases are only
#   visible to people with write access to the repository. Deleting it makes
#   the next run create a new key, and phones would then need the app
#   reinstalled once over USB. To manage the key yourself instead, add repo
#   secrets RIDE_KEYSTORE_B64 (base64 of a keystore whose key alias is
#   "ride") and RIDE_KEYSTORE_PASSWORD; they take precedence.
#
# Needs no secrets beyond the token GitHub gives every workflow run.

on:
  push:
    paths:
      - 'os/**'
      - '.github/workflows/ride-launcher-apk.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this build to phones as an over-the-air update'
        type: boolean
        default: true

# contents: write is needed to create releases and attach files to them.
permissions:
  contents: write

# One at a time: two first runs must not both create a signing key, and the
# published manifest must end up describing the newest build.
concurrency:
  group: ride-launcher-apk
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  KEY_RELEASE: Ride launcher signing key (do not delete)
  BUILD_RELEASE: Ride launcher (latest build)
  OTA_TAG: ride-ota

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Signing key
        env:
          RIDE_KEYSTORE_B64: ${{ secrets.RIDE_KEYSTORE_B64 }}
          RIDE_KEYSTORE_PASSWORD_SECRET: ${{ secrets.RIDE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/ride.jks"
          api="repos/$GITHUB_REPOSITORY"
          if [ -n "${RIDE_KEYSTORE_B64:-}" ]; then
            echo "$RIDE_KEYSTORE_B64" | base64 -d > "$store"
            pass="$RIDE_KEYSTORE_PASSWORD_SECRET"
            echo "Using the signing key from repo secrets."
          else
            # List every release and look for the key by name. A key is only
            # ever created when this listing succeeded and found none, because
            # a second key would lock every installed phone out of updates.
            gh api "$api/releases" --paginate --jq '.[]' | jq -s '.' > "$RUNNER_TEMP/releases.json"
            release=$(jq --arg n "$KEY_RELEASE" '[.[] | select(.draft and .name == $n)][0] // empty' \
              "$RUNNER_TEMP/releases.json")
            if [ -n "$release" ]; then
              jks=$(echo "$release" | jq -r '[.assets[] | select(.name == "ride.jks.b64")][0].id')
              pw=$(echo "$release" | jq -r '[.assets[] | select(.name == "ride.jks.pass")][0].id')
              if [ "$jks" = "null" ] || [ "$pw" = "null" ]; then
                echo "::error::The signing-key release exists but its files are missing. Not creating a new key, since that would break updates on installed phones. Restore the files or delete the release deliberately."
                exit 1
              fi
              gh api -H 'Accept: application/octet-stream' "$api/releases/assets/$jks" | base64 -d > "$store"
              pass=$(gh api -H 'Accept: application/octet-stream' "$api/releases/assets/$pw")
              echo "Using the signing key from the draft release."
            else
              pass=$(openssl rand -hex 24)
              keytool -genkeypair -keystore "$store" -storetype JKS -alias ride \
                -keyalg RSA -keysize 2048 -validity 10950 \
                -storepass "$pass" -keypass "$pass" -dname "CN=MAXAPACITY Ride"
              base64 -w0 "$store" > "$RUNNER_TEMP/ride.jks.b64"
              printf '%s' "$pass" > "$RUNNER_TEMP/ride.jks.pass"
              gh release create ride-signing-key \
                "$RUNNER_TEMP/ride.jks.b64" "$RUNNER_TEMP/ride.jks.pass" \
                --repo "$GITHUB_REPOSITORY" --draft --title "$KEY_RELEASE" \
                --notes "The key every MAXAPACITY ride launcher build is signed with. Created automatically by the Ride launcher APK workflow. Do not delete or publish this release: installed phones only accept updates signed with this key."
              echo "::notice::Created the app's signing key and stored it on a draft release."
            fi
          fi
          echo "::add-mask::$pass"
          keytool -list -keystore "$store" -storepass "$pass" -alias ride > /dev/null
          echo "RIDE_KEYSTORE=$store" >> "$GITHUB_ENV"
          echo "RIDE_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"

      # The protocol tests run first: a build whose controller write frames
      # are wrong must never reach a phone.
      - name: Test and build APK
        working-directory: os/launcher-apk
        run: gradle --no-daemon testReleaseUnitTest assembleRelease -PrideVersionCode=${{ github.run_number }}

      - name: Rename APK
        run: cp os/launcher-apk/build/outputs/apk/release/*.apk maxapacity-ride.apk

      # Delivered as a draft release (visible to collaborators only) rather
      # than a workflow artifact, which counts against the Actions storage quota.
      - name: Attach APK to draft release
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .name == \"$BUILD_RELEASE\") | .id" \
            | while read -r id; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
              done
          gh release create ride-launcher-latest maxapacity-ride.apk \
            --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "$BUILD_RELEASE" \
            --notes "MAXAPACITY ride launcher 1.0.${{ github.run_number }} from $GITHUB_SHA. First install: adb install maxapacity-ride.apk. After that the app updates itself."

      # Phones follow whatever this step publishes, so it only runs for main
      # and for runs started by hand, never for work-in-progress pushes.
      - name: Publish over-the-air update
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        run: |
          set -euo pipefail
          code=${{ github.run_number }}
          jq -n \
            --argjson versionCode "$code" \
            --arg versionName "1.0.$code" \
            --arg asset "maxapacity-ride.apk" \
            --arg sha256 "$(sha256sum maxapacity-ride.apk | cut -d' ' -f1)" \
            --argjson size "$(stat -c %s maxapacity-ride.apk)" \
            --arg commit "$GITHUB_SHA" \
            '{versionCode: $versionCode, versionName: $versionName, asset: $asset,
              sha256: $sha256, size: $size, commit: $commit}' > latest.json
          if gh release view "$OTA_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Update in place so the release never disappears from under a
            # phone that is checking. The APK goes up first and the manifest
            # last; a phone that catches the moment in between sees a
            # checksum mismatch and simply tries again later.
            gh release upload "$OTA_TAG" maxapacity-ride.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$OTA_TAG" --repo "$GITHUB_REPOSITORY" --notes-file latest.json
          else
            gh release create "$OTA_TAG" maxapacity-ride.apk \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "Ride launcher over-the-air update" --notes-file latest.json
          fi
          echo "::notice::Published 1.0.$code over the air."
          cat latest.json
