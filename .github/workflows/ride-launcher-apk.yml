name: Ride launcher APK

on:
  push:
    paths:
      - 'os/**'
      - '.github/workflows/ride-launcher-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: os/launcher-apk
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp os/launcher-apk/build/outputs/apk/debug/*.apk maxapacity-ride.apk
      - uses: actions/upload-artifact@v4
        with:
          name: maxapacity-ride
          path: maxapacity-ride.apk
