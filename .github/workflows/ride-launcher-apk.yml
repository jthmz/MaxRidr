name: Ride launcher APK

on:
  push:
    paths:
      - 'os/**'
      - '.github/workflows/ride-launcher-apk.yml'
  workflow_dispatch:

# contents: write is needed to attach the APK to a draft release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: os/launcher-apk
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp os/launcher-apk/build/outputs/apk/debug/*.apk maxapacity-ride.apk
      # Delivered as a draft release (visible to collaborators only) rather
      # than a workflow artifact, which counts against the Actions storage quota.
      - name: Attach APK to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Ride launcher (latest build)
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .name == \"$TITLE\") | .id" \
            | while read -r id; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
              done
          gh release create ride-launcher-latest maxapacity-ride.apk \
            --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "Debug build of the MAXAPACITY ride launcher from $GITHUB_SHA. Install with: adb install -r maxapacity-ride.apk"
